[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bootins"
version = "0.1.0"
description = "Research implementation of foot-mounted ZUPT-aided strapdown INS and loosely coupled GNSS fusion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
capture = ["bleak", "pyserial"]
plotting = ["matplotlib", "contextily", "folium"]
dev = ["bleak", "matplotlib", "pytest", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
